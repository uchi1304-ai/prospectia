services:

  backend:
    build:
      context: ./backend
    container_name: prospectia-backend
    env_file:
      - .env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: prospectia-frontend
    env_file:
      - .env
    ports:
      - "8501:8501"
    depends_on:
      - backend